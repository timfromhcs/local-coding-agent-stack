name: Docker Images Build & Smoke Test

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'docker-compose.yml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  docker-build:
    name: Build & Test Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Proxy Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.proxy
          push: false
          tags: local-coding-agent/proxy:latest

      - name: Build Claude CLI Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.claude
          push: false
          tags: local-coding-agent/claude:latest

      - name: Compose Configuration Validation
        run: |
          docker compose config
