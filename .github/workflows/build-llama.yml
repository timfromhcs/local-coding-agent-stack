name: Build llama.cpp Native Binaries

on:
  push:
    paths:
      - 'llama-src/**'
      - '.github/workflows/build-llama.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build llama.cpp (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-vulkan
            os: ubuntu-latest
            cmake_args: -DGGML_VULKAN=ON -DCMAKE_BUILD_TYPE=Release
            artifact_name: llama-linux-vulkan
          - target: windows-vulkan
            os: windows-latest
            cmake_args: -DGGML_VULKAN=ON -DCMAKE_BUILD_TYPE=Release
            artifact_name: llama-windows-vulkan
          - target: macos-metal
            os: macos-latest
            cmake_args: -DGGML_METAL=ON -DCMAKE_BUILD_TYPE=Release
            artifact_name: llama-macos-metal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux Vulkan SDK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev vulkan-tools glslang-tools glslc
          glslc --version
          echo "[+] Installing SPIRV-Headers for Vulkan CMake..."
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv-headers
          cmake -B /tmp/spirv-headers/build -S /tmp/spirv-headers -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --install /tmp/spirv-headers/build

      - name: Install Windows Vulkan SDK
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install vulkan-sdk -y --no-progress
          $vulkanPath = "C:\VulkanSDK"
          if (Test-Path $vulkanPath) {
            $latest = Get-ChildItem $vulkanPath | Sort-Object Name -Descending | Select-Object -First 1
            if ($latest) {
              echo "VULKAN_SDK=$($latest.FullName)" >> $env:GITHUB_ENV
              echo "$($latest.FullName)\bin" >> $env:GITHUB_PATH
            }
          }

      - name: Ensure llama.cpp source
        shell: bash
        run: |
          if [ ! -d "llama-src" ] || [ ! -f "llama-src/CMakeLists.txt" ]; then
            echo "[+] Cloning llama.cpp source repository..."
            rm -rf llama-src
            git clone --depth 1 https://github.com/ggerganov/llama.cpp.git llama-src
          fi

      - name: Configure CMake
        run: |
          cmake -B build -S llama-src ${{ matrix.cmake_args }}

      - name: Build llama.cpp
        run: |
          cmake --build build --config Release -j --target llama-server llama-cli llama-quantize

      - name: Package Artifacts
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            find build/bin -type f \( -name "*.exe" -o -name "*.dll" \) -exec cp {} dist/ \; 2>/dev/null || true
            cp build/bin/Release/*.exe dist/ 2>/dev/null || cp build/bin/*.exe dist/ 2>/dev/null || true
            cp build/bin/Release/*.dll dist/ 2>/dev/null || cp build/bin/*.dll dist/ 2>/dev/null || true
          else
            find build/bin -type f \( -name "llama-server*" -o -name "llama-cli*" -o -name "llama-quantize*" -o -name "*.so*" -o -name "*.dylib" \) -exec cp {} dist/ \; 2>/dev/null || true
            cp build/bin/llama-server dist/ 2>/dev/null || true
            cp build/bin/llama-cli dist/ 2>/dev/null || true
            cp build/bin/llama-quantize dist/ 2>/dev/null || true
          fi
          echo "=== Packaged Files in dist/ ==="
          ls -la dist/

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
